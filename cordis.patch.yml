- id: web
  config:
    searchProvider: aggregated
    fetchProvider: aggregated
- insert:
    - id: web-search-fetch
      name: dsh-web-search-fetch
      config:
        engines:
          deepseek:
            enabled: false
          tavily:
            enabled: true
          exa:
            enabled: false
          keenable:
            enabled: false
          crawl4ai:
            enabled: false
          github:
            enabled: false
          firecrawl:
            enabled: true
          tinyfish:
            enabled: false
          serply:
            enabled: false
          kimi:
            enabled: false
          bing:
            enabled: false
          aihot:
            enabled: false
        controls:
          preset: auto
          serviceEnabled:
            anysearch: true
            firecrawl: true
            tavily: true
            siliconflow: false
            http: true
